  <script>
    // State Management
    let currentMode = 'easy';
    let currentProblem = null;
    let streakCount = 0;
    let totalCorrectCount = 0;

    // GCD Math Helper
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        let t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    // Exact Fraction Handling Class
    class Fraction {
      constructor(num, den = 1) {
        if (den === 0) throw new Error("Denominator cannot be 0");
        if (den < 0) {
          num = -num;
          den = -den;
        }
        const g = gcd(num, den);
        this.num = num / g;
        this.den = den / g;
      }

      add(f) {
        return new Fraction(this.num * f.den + f.num * this.den, this.den * f.den);
      }

      sub(f) {
        return new Fraction(this.num * f.den - f.num * this.den, this.den * f.den);
      }

      toTex() {
        if (this.den === 1) return `${this.num}`;
        if (this.num < 0) return `-\\frac{${Math.abs(this.num)}}{${this.den}}`;
        return `\\frac{${this.num}}{${this.den}}`;
      }

      toCanonicalString() {
        if (this.den === 1) return `${this.num}`;
        return `${this.num}/${this.den}`;
      }
    }

    function randIntNonZero(min, max) {
      let val = 0;
      while (val === 0) {
        val = Math.floor(Math.random() * (max - min + 1)) + min;
      }
      return val;
    }

    // Keypad Input Functions
    function keypadInsert(text) {
      const input = document.getElementById('user-answer');
      input.focus();
      input.value += text;
      updateLivePreview();
    }

    function keypadBackspace() {
      const input = document.getElementById('user-answer');
      input.value = input.value.slice(0, -1);
      updateLivePreview();
    }

    function clearAnswerInput() {
      document.getElementById('user-answer').value = '';
      updateLivePreview();
      document.getElementById('answer-feedback').classList.add('hidden');
    }

    // Real-Time Math Preview Renderer
    function updateLivePreview() {
      const val = document.getElementById('user-answer').value.trim();
      const previewEl = document.getElementById('live-preview');

      if (!val) {
        previewEl.innerHTML = `<span class="text-slate-600 italic">無內容</span>`;
        return;
      }

      let tex = val
        .replace(/²/g, '^2')
        .replace(/\*/g, ' \\cdot ')
        .replace(/ln\|x\|/gi, '\\ln|x|')
        .replace(/ln\(x\)/gi, '\\ln(x)')
        .replace(/e\^x/gi, 'e^x')
        .replace(/e\^\{([^}]+)\}/gi, 'e^{$1}')
        .replace(/sinx/gi, '\\sin x')
        .replace(/cosx/gi, '\\cos x')
        .replace(/tanx/gi, '\\tan x')
        .replace(/sec\^2x/gi, '\\sec^2 x')
        .replace(/csc\^2x/gi, '\\csc^2 x')
        .replace(/secx/gi, '\\sec x')
        .replace(/cscx/gi, '\\csc x')
        .replace(/cotx/gi, '\\cot x');

      if (val.includes('/') && !val.includes('ln') && !val.includes('sin') && !val.includes('cos') && !val.includes('e^')) {
        const parts = val.split('/');
        if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
          tex = `\\frac{${parts[0].trim()}}{${parts[1].trim()}}`;
        }
      }

      previewEl.innerHTML = `$${tex}$`;

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([previewEl]);
      }
    }

        modeBadge.className = "text-xs font-semibold tracking-wider uppercase bg-sky-900/60 text-sky-300 px-3 py-1 rounded-full border border-sky-700/50";

      }

      generateProblem();
    }

    // Helper to format polynomials
    function formatPoly(A, B, C) {
      let str = "";
      if (A === 1) str += "x^2";
      else if (A === -1) str += "-x^2";
      else str += `${A}x^2`;

      if (B > 0) str += B === 1 ? " + x" : ` + ${B}x`;
      else if (B < 0) str += B === -1 ? " - x" : ` - ${Math.abs(B)}x`;

      if (C > 0) str += ` + ${C}`;
      else if (C < 0) str += ` - ${Math.abs(C)}`;

      return str;
    }

    function formatAntiDerivEasy(A, B, C) {
      const fA = new Fraction(A, 3);
      const fB = new Fraction(B, 2);

      let parts = [];
      let termA = (fA.den === 1) ? (fA.num === 1 ? "x^3" : (fA.num === -1 ? "-x^3" : `${fA.num}x^3`)) : fA.toTex() + "x^3";
      parts.push(termA);

      let termB = "";
      if (fB.num > 0) termB = `+ ${fB.toTex()}x^2`;
      else termB = `- ${fB.sub(new Fraction(0)).toTex().replace('-', '')}x^2`;
      parts.push(termB);

      let termC = C > 0 ? `+ ${C === 1 ? '' : C}x` : `- ${Math.abs(C) === 1 ? '' : Math.abs(C)}x`;
      parts.push(termC);

      return parts.join(" ");
    }

    function evalAntiDeriv(A, B, C, x) {
      const term1 = new Fraction(A * Math.pow(x, 3), 3);
      const term2 = new Fraction(B * Math.pow(x, 2), 2);
      const term3 = new Fraction(C * x, 1);
      return term1.add(term2).add(term3);
    }

    // Problem Generator Selector
    function generateProblem() {
      clearAnswerInput();

      if (currentMode === 'easy') generateEasyProblem();
      else if (currentMode === 'medium') generateMediumProblem();
      else generateHardProblem();

      renderProblem();
    }

    // 1. Easy Mode Problem Generator
    function generateEasyProblem() {
      const r1 = Math.floor(Math.random() * 15) - 7;
      let r2 = Math.floor(Math.random() * 15) - 7;
      while (r2 === r1) r2 = Math.floor(Math.random() * 15) - 7;

      const a = Math.min(r1, r2);
      const b = Math.max(r1, r2);
      const A = randIntNonZero(-3, 3);
      const B = randIntNonZero(-6, 6);
      const C = randIntNonZero(-8, 8);

      const Fb = evalAntiDeriv(A, B, C, b);
      const Fa = evalAntiDeriv(A, B, C, a);
      const valFrac = Fb.sub(Fa);

      currentProblem = {
        mode: 'easy',
        a, b, A, B, C, valFrac,
        canonicalAnswer: valFrac.toCanonicalString()
      };
    }

    // 2. Medium Mode Problem Generator
    function generateMediumProblem() {
      const type = Math.floor(Math.random() * 7);
      const A = randIntNonZero(-5, 5);

      let integrandTex = "", answerTex = "", step2Tex = "";
      let canonicalRegexes = [], primaryAnswerStr = "";

      switch (type) {
        case 0: // A/x
          integrandTex = A === 1 ? "\\frac{1}{x}" : (A === -1 ? "-\\frac{1}{x}" : `\\frac{${A}}{x}`);
          primaryAnswerStr = A === 1 ? "ln|x| + C" : (A === -1 ? "-ln|x| + C" : `${A}ln|x| + C`);
          answerTex = A === 1 ? "\\ln|x| + C" : (A === -1 ? "-\\ln|x| + C" : `${A}\\ln|x| + C`);
          step2Tex = `\\int \\frac{k}{x} \\, dx = k \\ln|x| + C`;
          canonicalRegexes = [new RegExp(`^${A === 1 ? '' : (A === -1 ? '-' : A)}\\s*(ln\\|x\\||lnx|ln\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;

        case 1: // A e^x
          integrandTex = A === 1 ? "e^x" : (A === -1 ? "-e^x" : `${A} e^x`);
          primaryAnswerStr = A === 1 ? "e^x + C" : (A === -1 ? "-e^x + C" : `${A}e^x + C`);
          answerTex = A === 1 ? "e^x + C" : (A === -1 ? "-e^x + C" : `${A} e^x + C`);
          step2Tex = `\\int e^x \\, dx = e^x + C`;
          canonicalRegexes = [new RegExp(`^${A === 1 ? '' : (A === -1 ? '-' : A)}\\s*e\\^x\\s*\\+\\s*c$`, 'i')];
          break;

        case 2: // A sin x
          integrandTex = A === 1 ? "\\sin x" : (A === -1 ? "-\\sin x" : `${A} \\sin x`);
          const coeffCos = -A;
          primaryAnswerStr = coeffCos === 1 ? "cosx + C" : (coeffCos === -1 ? "-cosx + C" : `${coeffCos}cosx + C`);
          answerTex = coeffCos === 1 ? "\\cos x + C" : (coeffCos === -1 ? "-\\cos x + C" : `${coeffCos} \\cos x + C`);
          step2Tex = `\\int \\sin x \\, dx = -\\cos x + C`;
          canonicalRegexes = [new RegExp(`^${coeffCos === 1 ? '' : (coeffCos === -1 ? '-' : coeffCos)}\\s*(cosx|cos\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;

        case 3: // A cos x
          integrandTex = A === 1 ? "\\cos x" : (A === -1 ? "-\\cos x" : `${A} \\cos x`);
          primaryAnswerStr = A === 1 ? "sinx + C" : (A === -1 ? "-sinx + C" : `${A}sinx + C`);
          answerTex = A === 1 ? "\\sin x + C" : (A === -1 ? "-\\sin x + C" : `${A} \\sin x + C`);
          step2Tex = `\\int \\cos x \\, dx = \\sin x + C`;
          canonicalRegexes = [new RegExp(`^${A === 1 ? '' : (A === -1 ? '-' : A)}\\s*(sinx|sin\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;

        case 4: // A sec^2 x
          integrandTex = A === 1 ? "\\sec^2 x" : (A === -1 ? "-\\sec^2 x" : `${A} \\sec^2 x`);
          primaryAnswerStr = A === 1 ? "tanx + C" : (A === -1 ? "-tanx + C" : `${A}tanx + C`);
          answerTex = A === 1 ? "\\tan x + C" : (A === -1 ? "-\\tan x + C" : `${A} \\tan x + C`);
          step2Tex = `\\int \\sec^2 x \\, dx = \\tan x + C`;
          canonicalRegexes = [new RegExp(`^${A === 1 ? '' : (A === -1 ? '-' : A)}\\s*(tanx|tan\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;

        case 5: // A csc^2 x
          integrandTex = A === 1 ? "\\csc^2 x" : (A === -1 ? "-\\csc^2 x" : `${A} \\csc^2 x`);
          const coeffCot = -A;
          primaryAnswerStr = coeffCot === 1 ? "cotx + C" : (coeffCot === -1 ? "-cotx + C" : `${coeffCot}cotx + C`);
          answerTex = coeffCot === 1 ? "\\cot x + C" : (coeffCot === -1 ? "-\\cot x + C" : `${coeffCot} \\cot x + C`);
          step2Tex = `\\int \\csc^2 x \\, dx = -\\cot x + C`;
          canonicalRegexes = [new RegExp(`^${coeffCot === 1 ? '' : (coeffCot === -1 ? '-' : coeffCot)}\\s*(cotx|cot\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;

        case 6: // A sec x tan x
          integrandTex = A === 1 ? "\\sec x \\tan x" : (A === -1 ? "-\\sec x \\tan x" : `${A} \\sec x \\tan x`);
          primaryAnswerStr = A === 1 ? "secx + C" : (A === -1 ? "-secx + C" : `${A}secx + C`);
          answerTex = A === 1 ? "\\sec x + C" : (A === -1 ? "- \\sec x + C" : `${A} \\sec x + C`);
          step2Tex = `\\int \\sec x \\tan x \\, dx = \\sec x + C`;
          canonicalRegexes = [new RegExp(`^${A === 1 ? '' : (A === -1 ? '-' : A)}\\s*(secx|sec\\(x\\))\\s*\\+\\s*c$`, 'i')];
          break;
      }

      currentProblem = {
        mode: 'medium',
        A, type, integrandTex, answerTex, step2Tex, canonicalRegexes, primaryAnswerStr
      };
    }

    // 3. Hard Mode Problem Generator (IBP & Partial Fractions)
    function generateHardProblem() {
      const isIBP = Math.random() < 0.55; // 55% IBP, 45% Partial Fractions

      if (isIBP) {
        // Integration by Parts
        const ibpType = Math.floor(Math.random() * 4);
        const a = randIntNonZero(-3, 3);

        let integrandTex = "", uTex = "", dvTex = "", duTex = "", vTex = "";
        let answerTex = "", primaryAnswerStr = "";
        let canonicalRegexes = [];

        if (ibpType === 0) { // ∫ x e^{ax} dx => (x/a)e^{ax} - (1/a^2)e^{ax} + C
          integrandTex = a === 1 ? "x e^x" : (a === -1 ? "x e^{-x}" : `x e^{${a}x}`);
          uTex = "x";
          dvTex = a === 1 ? "e^x dx" : `e^{${a}x} dx`;
          duTex = "dx";
          vTex = a === 1 ? "e^x" : (a === -1 ? "-e^{-x}" : `\\frac{1}{${a}} e^{${a}x}`);

          const term1 = a === 1 ? "x e^x" : (a === -1 ? "-x e^{-x}" : `\\frac{x}{${a}} e^{${a}x}`);
          const aSquare = a * a;
          const term2 = a === 1 ? "- e^x" : `- \\frac{1}{${aSquare}} e^{${a}x}`;

          answerTex = `${term1} ${term2} + C`;
          primaryAnswerStr = a === 1 ? "x*e^x - e^x + C" : `(x/${a})*e^(${a}x) - (1/${aSquare})*e^(${a}x) + C`;

          // Dynamic RegEx pattern matching for variations
          if (a === 1) {
            canonicalRegexes = [
              /^x\*?e\^x-e\^x\+c$/i,
              /^\(x-1\)\*?e\^x\+c$/i,
              /^e\^x\*?\(x-1\)\+c$/i,
              /^-e\^x\+x\*?e\^x\+c$/i
            ];
          } else {
            canonicalRegexes = [
              new RegExp(`^(${a === -1 ? '-' : ''}x(\\/|\\*)${Math.abs(a) === 1 ? '' : Math.abs(a)})\\*?e\\^\\(?${a}x\\)?-?.*\\+c$`, 'i'),
              new RegExp(`^.*e\\^\\(?${a}x\\)?.*\\+c$`, 'i')
            ];
          }

        } else if (ibpType === 1) { // ∫ x sin(ax) dx => -(x/a)cos(ax) + (1/a^2)sin(ax) + C
          integrandTex = a === 1 ? "x \\sin x" : `x \\sin(${a}x)`;
          uTex = "x";
          dvTex = a === 1 ? "\\sin x dx" : `\\sin(${a}x) dx`;
          duTex = "dx";
          vTex = a === 1 ? "-\\cos x" : `-\\frac{1}{${a}} \\cos(${a}x)`;

          const aSquare = a * a;
          answerTex = a === 1 
            ? "-x \\cos x + \\sin x + C" 
            : `-\\frac{x}{${a}} \\cos(${a}x) + \\frac{1}{${aSquare}} \\sin(${a}x) + C`;

          primaryAnswerStr = a === 1 ? "-x*cosx + sinx + C" : `-(x/${a})cos(${a}x) + (1/${aSquare})sin(${a}x) + C`;

          canonicalRegexes = [
            new RegExp(`^-?x(\\/|\\*|)?.*cos.*\\+.*sin.*\\+c$`, 'i'),
            new RegExp(`^.*sin.*-.*x.*cos.*\\+c$`, 'i')
          ];

        } else if (ibpType === 2) { // ∫ x cos(ax) dx => (x/a)sin(ax) + (1/a^2)cos(ax) + C
          integrandTex = a === 1 ? "x \\cos x" : `x \\cos(${a}x)`;
          uTex = "x";
          dvTex = a === 1 ? "\\cos x dx" : `\\cos(${a}x) dx`;
          duTex = "dx";
          vTex = a === 1 ? "\\sin x" : `\\frac{1}{${a}} \\sin(${a}x)`;

          const aSquare = a * a;
          answerTex = a === 1 
            ? "x \\sin x + \\cos x + C" 
            : `\\frac{x}{${a}} \\sin(${a}x) + \\frac{1}{${aSquare}} \\cos(${a}x) + C`;

          primaryAnswerStr = a === 1 ? "x*sinx + cosx + C" : `(x/${a})sin(${a}x) + (1/${aSquare})cos(${a}x) + C`;

          canonicalRegexes = [
            new RegExp(`^.*x.*sin.*\\+.*cos.*\\+c$`, 'i'),
            new RegExp(`^.*cos.*\\+.*x.*sin.*\\+c$`, 'i')
          ];

        } else { // ∫ x ln(x) dx => (x^2 / 2) ln(x) - x^2 / 4 + C
          integrandTex = "x \\ln x";
          uTex = "\\ln x";
          dvTex = "x dx";
          duTex = "\\frac{1}{x} dx";
          vTex = "\\frac{x^2}{2}";

          answerTex = "\\frac{x^2}{2} \\ln x - \\frac{x^2}{4} + C";
          primaryAnswerStr = "(x^2/2)ln(x) - x^2/4 + C";

          canonicalRegexes = [
            /^(x\^2\/2|\(x\^2\/2\)|0\.5x\^2)\*?(lnx|ln\|x\||ln\(x\))-(x\^2\/4|\(x\^2\/4\)|0\.25x\^2)\+c$/i,
            /^-?(x\^2\/4|\(x\^2\/4\)\+.*ln.*)\+c$/i,
            /^.*x\^2.*ln.*-.*x\^2.*\/4.*\+c$/i
          ];
        }

        currentProblem = {
          mode: 'hard',
          subType: 'ibp',
          topicName: '分部積分法 (Integration by Parts)',
          integrandTex, uTex, dvTex, duTex, vTex, answerTex,
          primaryAnswerStr, canonicalRegexes
        };

      } else {
        // Partial Fractions
        const pfType = Math.floor(Math.random() * 2);

        if (pfType === 0) { // ∫ 1 / (x^2 - a^2) dx => (1/2a) ln|(x-a)/(x+a)| + C
          const a = Math.floor(Math.random() * 4) + 1; // 1, 2, 3, 4
          const a2 = a * a;
          const twoA = 2 * a;

          const integrandTex = `\\frac{1}{x^2 - ${a2}}`;
          const factorTex = `\\frac{1}{(x - ${a})(x + ${a})}`;
          const decompTex = `\\frac{1}{${twoA}}\\left( \\frac{1}{x - ${a}} - \\frac{1}{x + ${a}} \\right)`;
          
          const fracTex = twoA === 2 ? "\\frac{1}{2}" : `\\frac{1}{${twoA}}`;
          const answerTex = `${fracTex} \\ln\\left| \\frac{x - ${a}}{x + ${a}} \\right| + C`;
          const primaryAnswerStr = `(1/${twoA})ln|(x-${a})/(x+${a})| + C`;

          const canonicalRegexes = [
            new RegExp(`^.*(1\\/${twoA}|${1/twoA}).*ln.*\\+c$`, 'i'),
            new RegExp(`^.*ln\\|?\\(?(x-${a})\\/(x\\+${a})\\)?\\|?\\+c$`, 'i')
          ];

          currentProblem = {
            mode: 'hard',
            subType: 'pf_diff_sq',
            topicName: '部分分式拆解 (Partial Fractions)',
            a, a2, twoA, integrandTex, factorTex, decompTex, answerTex,
            primaryAnswerStr, canonicalRegexes
          };

        } else { // ∫ (Ax + B) / ((x - a)(x - b)) dx
          let a = randIntNonZero(-4, 4);
          let b = randIntNonZero(-4, 4);
          while (b === a) b = randIntNonZero(-4, 4);

          const A_const = randIntNonZero(-3, 3);
          const B_const = randIntNonZero(-3, 3);

          // P(x) = A_const*(x - b) + B_const*(x - a)
          // Numerator coeff: (A_const + B_const)x - (A_const*b + B_const*a)
          const numXCoeff = A_const + B_const;
          const numConst = -(A_const * b + B_const * a);

          let numTex = "";
          if (numXCoeff !== 0) {
            numTex += (numXCoeff === 1) ? "x" : ((numXCoeff === -1) ? "-x" : `${numXCoeff}x`);
            if (numConst > 0) numTex += ` + ${numConst}`;
            else if (numConst < 0) numTex += ` - ${Math.abs(numConst)}`;
          } else {
            numTex = `${numConst}`;
          }

          const denTex = `(x ${a > 0 ? '- ' + a : '+ ' + Math.abs(a)})(x ${b > 0 ? '- ' + b : '+ ' + Math.abs(b)})`;
          const integrandTex = `\\frac{${numTex}}{${denTex}}`;

          const termAStr = A_const === 1 ? "" : (A_const === -1 ? "-" : `${A_const}`);
          const termBStr = B_const === 1 ? "" : (B_const === -1 ? "-" : `${B_const}`);

          const termATex = `${termAStr}\\ln|x ${a > 0 ? '- ' + a : '+ ' + Math.abs(a)}|`;
          const termBTex = `${B_const > 0 ? '+ ' : '- '}${Math.abs(B_const) === 1 ? '' : Math.abs(B_const)}\\ln|x ${b > 0 ? '- ' + b : '+ ' + Math.abs(b)}|`;

          const answerTex = `${termATex} ${termBTex} + C`;
          const primaryAnswerStr = `${A_const}ln|x-${a}| + ${B_const}ln|x-${b}| + C`;

          const canonicalRegexes = [
            new RegExp(`^.*ln.*\\+.*ln.*\\+c$`, 'i'),
            new RegExp(`^.*ln\\|?x.*\\+c$`, 'i')
          ];

          currentProblem = {
            mode: 'hard',
            subType: 'pf_general',
            topicName: '部分分式拆解 (Partial Fractions)',
            a, b, A_const, B_const, integrandTex, denTex, answerTex,
            primaryAnswerStr, canonicalRegexes
          };
        }
      }
    }

    // Render LaTeX Math Formulas to DOM
    function renderProblem() {
      if (!currentProblem) return;

      const probEl = document.getElementById('math-problem');
      const step1El = document.getElementById('step-1-math');
      const step2El = document.getElementById('step-2-math');
      const step3Container = document.getElementById('step-3-container');
      const step3Title = document.getElementById('step-3-title');
      const step3El = document.getElementById('step-3-math');
      const step4El = document.getElementById('step-4-math');
      const topicTag = document.getElementById('topic-tag');

      if (currentProblem.mode === 'easy') {
        const { a, b, A, B, C, valFrac } = currentProblem;
        const polyTex = formatPoly(A, B, C);
        const antiTex = formatAntiDerivEasy(A, B, C);

        probEl.innerHTML = `$$\\int_{${a}}^{${b}} \\left( ${polyTex} \\right) \\, dx$$`;
        step1El.innerHTML = `$$\\int_{${a}}^{${b}} \\left( ${polyTex} \\right) \\, dx$$`;
        step2El.innerHTML = `$$F(x) = ${antiTex}$$`;

        const Fb = evalAntiDeriv(A, B, C, b);
        const Fa = evalAntiDeriv(A, B, C, a);
        step3Container.classList.remove('hidden');
        step3Title.innerText = "步驟 3：代入上下界計算";
        step3El.innerHTML = `$$F(${b}) - F(${a}) = \\left( ${Fb.toTex()} \\right) - \\left( ${Fa.toTex()} \\right)$$`;

        step4El.innerHTML = `$$\\int_{${a}}^{${b}} \\left( ${polyTex} \\right) \\, dx = ${valFrac.toTex()}$$`;

      } else if (currentProblem.mode === 'medium') {
        const { integrandTex, answerTex, step2Tex } = currentProblem;

        probEl.innerHTML = `$$\\int \\left( ${integrandTex} \\right) \\, dx$$`;
        step1El.innerHTML = `$$\\int \\left( ${integrandTex} \\right) \\, dx$$`;
        step2El.innerHTML = `$$${step2Tex}$$`;
        
        step3Container.classList.add('hidden');
        step4El.innerHTML = `$$\\int \\left( ${integrandTex} \\right) \\, dx = ${answerTex}$$`;

      } else { // Hard Mode Step Rendering
        topicTag.innerText = currentProblem.topicName;

        if (currentProblem.subType === 'ibp') {
          const { integrandTex, uTex, dvTex, duTex, vTex, answerTex } = currentProblem;

          probEl.innerHTML = `$$\\int ${integrandTex} \\, dx$$`;
          step1El.innerHTML = `$$\\text{使用分部積分公式：} \\int u \\, dv = uv - \\int v \\, du$$`;
          step2El.innerHTML = `$$\\begin{aligned} u &= ${uTex}, & dv &= ${dvTex} \\\\ du &= ${duTex}, & v &= ${vTex} \\end{aligned}$$`;

          step3Container.classList.remove('hidden');
          step3Title.innerText = "步驟 3：套用分部積分公式代入";
          step3El.innerHTML = `$$\\int ${integrandTex} \\, dx = \\left(${uTex}\\right)\\left(${vTex}\\right) - \\int \\left(${vTex}\\right) \\left(${duTex}\\right)$$`;

          step4El.innerHTML = `$$\\int ${integrandTex} \\, dx = ${answerTex}$$`;

        } else if (currentProblem.subType === 'pf_diff_sq') {
          const { a, twoA, integrandTex, factorTex, decompTex, answerTex } = currentProblem;

          probEl.innerHTML = `$$\\int ${integrandTex} \\, dx$$`;
          step1El.innerHTML = `$$\\text{將分母進行因式分解：} ${integrandTex} = ${factorTex}$$`;
          step2El.innerHTML = `$$\\text{設部分分式：} ${factorTex} = \\frac{A}{x - ${a}} + \\frac{B}{x + ${a}} \\implies A = \\frac{1}{${twoA}}, \\; B = -\\frac{1}{${twoA}}$$`;

          step3Container.classList.remove('hidden');
          step3Title.innerText = "步驟 3：拆解項個別進行積分";
          step3El.innerHTML = `$$\\int ${decompTex} \\, dx$$`;

          step4El.innerHTML = `$$\\int ${integrandTex} \\, dx = ${answerTex}$$`;

        } else { // pf_general
          const { a, b, A_const, B_const, integrandTex, denTex, answerTex } = currentProblem;

          probEl.innerHTML = `$$\\int ${integrandTex} \\, dx$$`;
          step1El.innerHTML = `$$\\text{觀察分母因式分解型態：} ${denTex}$$`;
          step2El.innerHTML = `$$\\text{設部分分式拆解：} \\frac{A}{x ${a > 0 ? '- ' + a : '+ ' + Math.abs(a)}} + \\frac{B}{x ${b > 0 ? '- ' + b : '+ ' + Math.abs(b)}}$$`;

          step3Container.classList.remove('hidden');
          step3Title.innerText = "步驟 3：解出常數係數 A 與 B";
          step3El.innerHTML = `$$\\text{通分對比係數得：} A = ${A_const}, \\quad B = ${B_const}$$`;

          step4El.innerHTML = `$$\\int ${integrandTex} \\, dx = ${answerTex}$$`;
        }
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // Toggle Solution Visibility
    function toggleSolution() {
      const solutionSection = document.getElementById('solution-section');
      const textToggle = document.getElementById('text-toggle-solution');

      if (solutionSection.classList.contains('hidden')) {
        solutionSection.classList.remove('hidden');
        textToggle.innerText = "隱藏詳細解答";
      } else {
        solutionSection.classList.add('hidden');
        textToggle.innerText = "查看詳細解答";
      }
    }

    // Answer Evaluation & Verification System
    function checkAnswer() {
      const input = document.getElementById('user-answer').value.trim();
      const feedback = document.getElementById('answer-feedback');

      feedback.classList.remove('hidden', 'bg-emerald-900/60', 'text-emerald-200', 'border-emerald-600', 'bg-rose-900/60', 'text-rose-200', 'border-rose-600', 'bg-amber-900/60', 'text-amber-200', 'border-amber-600');
      feedback.classList.add('border');

      if (!input) {
        feedback.innerText = "請先輸入您的答案！";
        feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
        return;
      }

      if (currentMode === 'easy') {
        // --- Easy Mode Verification ---
        let userNum = 0, userDen = 1, isFractionFormat = false;

        if (input.includes('/')) {
          isFractionFormat = true;
          const parts = input.split('/');
          if (parts.length === 2) {
            const n = parseInt(parts[0].trim(), 10);
            const d = parseInt(parts[1].trim(), 10);
            if (!isNaN(n) && !isNaN(d) && d !== 0) {
              userNum = n;
              userDen = d;
            } else {
              feedback.innerText = "格式錯誤！分數請輸入整數分子與分母 (例如: 31/2)。";
              feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
              return;
            }
          } else {
            feedback.innerText = "格式錯誤！分數只能含有一個斜線 (例如: 31/2)。";
            feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
            return;
          }
        } else {
          const val = parseInt(input.trim(), 10);
          if (!isNaN(val) && input.trim() === val.toString()) {
            userNum = val;
            userDen = 1;
          } else {
            feedback.innerText = "請輸入最簡分數或整數格式 (例如: 31/2 或 5)。";
            feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
            return;
          }
        }

        if (userDen < 0) {
          userNum = -userNum;
          userDen = -userDen;
        }

        const exact = currentProblem.valFrac;
        const isValueEqual = (userNum * exact.den === exact.num * userDen);

        if (!isValueEqual) {
          resetStreak();
          feedback.innerText = "❌ 答案不正確，請再檢查計算！";
          feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
          return;
        }

        const userGcd = gcd(userNum, userDen);
        if (userGcd > 1) {
          feedback.innerText = `⚠️ 數值正確，但請將分數約分為最簡分數！(應為: ${exact.toCanonicalString()})`;
          feedback.classList.add('bg-amber-900/60', 'text-amber-200', 'border-amber-600');
          return;
        }

        if (exact.den === 1 && userDen === 1 && isFractionFormat) {
          feedback.innerText = `⚠️ 數值正確！結果為整數，請直接輸入整數 (例如: ${exact.num})。`;
          feedback.classList.add('bg-amber-900/60', 'text-amber-200', 'border-amber-600');
          return;
        }

        incrementStreak();
        feedback.innerText = `🎉 答對了！定積分結果為最簡分數/整數 (${exact.toCanonicalString()})！`;
        feedback.classList.add('bg-emerald-900/60', 'text-emerald-200', 'border-emerald-600');

      } else {
        // --- Medium & Hard Mode Verification ---
        const cleanInput = input.replace(/\s+/g, '');

        // 1. Check for + C
        if (!/\+c$/i.test(cleanInput)) {
          feedback.innerText = "⚠️ 不定積分別忘了常數項！請在答案最後加上 '+ C' 或 '+c'。";
          feedback.classList.add('bg-amber-900/60', 'text-amber-200', 'border-amber-600');
          return;
        }

        // 2. Algebraic equivalence check using regex patterns
        let isMatch = false;
        for (let reg of currentProblem.canonicalRegexes) {
          if (reg.test(cleanInput)) {
            isMatch = true;
            break;
          }
        }

        if (isMatch) {
          incrementStreak();
          feedback.innerText = `🎉 完全正確！解答為 ${currentProblem.primaryAnswerStr}`;
          feedback.classList.add('bg-emerald-900/60', 'text-emerald-200', 'border-emerald-600');
        } else {
          resetStreak();
          feedback.innerText = `❌ 答案不符，請檢查函數符號或正負號！(提示參考: ${currentProblem.primaryAnswerStr})`;
          feedback.classList.add('bg-rose-900/60', 'text-rose-200', 'border-rose-600');
        }
      }
    }

    // Streak and Score Counters
    function incrementStreak() {
      streakCount++;
      totalCorrectCount++;
      document.getElementById('streak-counter').innerText = `連續答對：${streakCount} 題`;
      document.getElementById('total-correct').innerText = totalCorrectCount;
    }

    function resetStreak() {
      streakCount = 0;
      document.getElementById('streak-counter').innerText = `連續答對：0 題`;
    }

    // Initialize Application
    window.onload = function() {
      switchMode('easy');
    };
  </script>
